[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench"]

[project]
name = "cognitive-bench"
version = "0.1.0"
description = "COGNITIVE benchmark harness + smoke validation"
requires-python = ">=3.11"
dependencies = [
    "cognitive-control-plane",
    "cognitive-admission",
    "httpx>=0.27",
    "pydantic>=2.7",
    "click>=8.1",
]

[dependency-groups]
dev = [ "pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5" ]

[tool.uv.sources]
cognitive-control-plane = { workspace = true }
cognitive-admission = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = ["unit", "contract", "integration"]

[tool.ruff]
line-length = 100
target-version = "py311"