name: temporary-platform-model-refresh
on:
  push:
    branches:
      - codex/034-person-research-case-closure
permissions:
  contents: write
concurrency:
  group: temporary-platform-model-refresh
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/034-person-research-case-closure
          persist-credentials: true
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install the locked workspace
        run: uv sync --locked --all-packages --all-groups
      - name: Regenerate machine-derived platform documentation
        run: .venv/bin/python -m platform_model.build
      - name: Verify the regenerated model
        run: .venv/bin/python -m platform_model.build --check
      - name: Commit generated artifacts back to the feature branch
        run: |
          git add README.md docs
          if git diff --cached --quiet; then
            echo "Generated artifacts already match."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(platform-model): regenerate docs for current feature tree"
          git push origin HEAD:codex/034-person-research-case-closure
