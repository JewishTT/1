name: platform-model-refresh-artifact
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: platform-model-refresh-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install locked workspace
        run: uv sync --locked --all-packages --all-groups
      - name: Regenerate the platform model from this exact source tree
        run: .venv/bin/python -m platform_model.build
      - name: Collect generator output and source revision
        run: |
          mkdir -p artifacts/platform-model-refresh
          printf '%s\n' "${GITHUB_SHA}" > artifacts/platform-model-refresh/GENERATED_FROM_SHA
          tar -czf artifacts/platform-model-refresh/platform-model-generated.tar.gz \
            docs/platform \
            README.md \
            docs/README.md \
            docs/CONTRIBUTING.md \
            docs/architecture/overview.md \
            docs/architecture/stream-processing.md \
            docs/architecture/fabric-collection.md \
            docs/architecture/multi-region.md \
            docs/architecture/dynamic-entity-invariant.md \
            docs/architecture/donors/00-INDEX.md \
            docs/adr/0028-context-definition-identity-and-placement.md
      - name: Upload generated platform artifacts for review and commit
        uses: actions/upload-artifact@v4
        with:
          name: platform-model-refresh
          path: artifacts/platform-model-refresh/
          if-no-files-found: error
          retention-days: 14
