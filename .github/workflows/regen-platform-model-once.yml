name: regenerate-platform-model-once
on:
  push:
    branches:
      - codex/034-person-research-case-closure
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/034-person-research-case-closure
          persist-credentials: true
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install the locked workspace
        run: uv sync --locked --all-packages --all-groups
      - name: Remove this one-shot workflow before generating
        run: git rm -f .github/workflows/regen-platform-model-once.yml
      - name: Regenerate and verify the final tree
        shell: bash
        run: |
          set -euo pipefail
          stable=0
          for attempt in 1 2 3 4; do
            echo "Platform model generation pass ${attempt}/4"
            .venv/bin/python -m platform_model.build
            if .venv/bin/python -m platform_model.build --check; then
              stable=1
              break
            fi
          done
          if [ "$stable" -ne 1 ]; then
            echo "Generated platform model did not converge after four passes."
            exit 1
          fi
      - name: Commit only the regenerated artifacts
        run: |
          git add README.md docs
          if git diff --cached --quiet; then
            echo "Generated artifacts already match the source tree."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(platform-model): regenerate committed architecture artifacts"
          git push origin HEAD:codex/034-person-research-case-closure
