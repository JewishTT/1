name: regenerate-platform-model-once
on:
  push:
    branches:
      - codex/034-person-research-case-closure
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/034-person-research-case-closure
          persist-credentials: true
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install the locked workspace
        run: uv sync --locked --all-packages --all-groups
      - name: Regenerate all source-derived platform model artifacts
        run: .venv/bin/python -m platform_model.build
      - name: Commit generated docs and remove this one-shot workflow
        run: |
          git add README.md docs
          git rm -f .github/workflows/regen-platform-model-once.yml
          if git diff --cached --quiet; then
            echo "No generated platform-model changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(platform-model): regenerate committed architecture artifacts"
          git push origin HEAD:codex/034-person-research-case-closure
