name: repo-hygiene

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-hygiene-${{ github.workflow }}-\${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  hygiene-and-foundation-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install the locked workspace
        run: uv sync --locked --all-packages --all-groups
      - name: Reject tracked local output and generated run artifacts
        run: .venv/bin/python tools/repo_hygiene.py --check
      - name: Test repository hygiene policy
        run: .venv/bin/pytest tools/tests/test_repo_hygiene.py -q
      - name: Test verified-identity RoE, honest metrics, and DLQ fail-closed contracts
        run: .venv/bin/pytest apps/control-plane/tests/test_specops_roe_auth.py apps/control-plane/tests/test_metrics_honesty.py apps/control-plane/tests/test_quarantine_api.py -q
      - name: Test installed wheel package manifest
        run: |
          .venv/bin/pytest apps/control-plane/tests/unit/test_wheel_package_manifest.py -q
          uv build --package cognitive-control-plane --wheel --out-dir "$RUNNER_TEMP/control-plane-wheel"
          .venv/bin/python -c "from pathlib import Path; from zipfile import ZipFile; wheel = next(Path(r'$RUNNER_TEMP/control-plane-wheel').glob('*.whl')); names = ZipFile(wheel).namelist(); assert any(n.startswith('context_engine/') for n in names); assert any(n.startswith('semantic_path/') for n in names); print(f'verified wheel contents: {wheel.name}')"
      - name: Verify operational schema ownership and outbox fail-closed behavior
        run: .venv/bin/pytest apps/control-plane/tests/unit/test_operational_schema_ownership.py apps/control-plane/tests/unit/test_temporal_materialization_dispatch.py -q
      - name: Verify durable tenant-scoped quarantine and worker hand-off
        run: |
          .venv/bin/pytest apps/shared/tests/unit/test_dlq_durable.py apps/acquisition/tests/unit/test_worker_failure_persistence.py -q
          .venv/bin/pytest apps/control-plane/tests/test_quarantine_api.py -q
      - name: Verify generated platform model is current
        run: .venv/bin/python -m platform_model.build --check
