name: research-case-webapp
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  webapp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/webapp/package-lock.json
      - name: Install locked web dependencies
        working-directory: apps/webapp
        run: npm ci
      - name: Typecheck and build the web application
        working-directory: apps/webapp
        run: npm run build
      - name: Run Feature 034 API client contract tests
        working-directory: apps/webapp
        run: npm test -- src/features/research-case/api.test.ts
      - name: Run complete web application test suite
        working-directory: apps/webapp
        run: npm test
