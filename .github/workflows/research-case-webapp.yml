name: research-case-webapp
on:
  push:
    branches: ["**"]
  pull_request:
# A branch push and its PR event otherwise launch duplicate full browser installs.
# Use the source branch name for both event types and keep only the newest sweep.
concurrency:
  group: ui-regression-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  webapp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/webapp/package-lock.json
      - name: Install locked web dependencies
        working-directory: apps/webapp
        run: npm ci
      - name: Install Playwright Chromium and browser dependencies
        working-directory: apps/webapp
        run: npx playwright install --with-deps chromium
      - name: Typecheck and build the web application
        id: build
        working-directory: apps/webapp
        run: npm run build
      - name: Run Feature 034 API client contract tests
        working-directory: apps/webapp
        run: npm test -- src/features/research-case/api.test.ts
      - name: Run complete web application test suite
        working-directory: apps/webapp
        run: npm test

      - name: Start Vite for screenshot regression
        if: ${{ always() && steps.build.outcome == 'success' }}
        working-directory: apps/webapp
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/cognitive-vite.log 2>&1 &
          echo $! > /tmp/cognitive-vite.pid
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/ui-kit >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/cognitive-vite.log
          exit 1
      - name: Capture responsive and interactive UI screenshots
        if: ${{ always() && steps.build.outcome == 'success' }}
        working-directory: apps/webapp
        env:
          UI_SHOTS_DIR: artifacts/ui-screenshots
        run: npm run ui:shoot:design-system -- http://127.0.0.1:5173 artifacts/ui-screenshots
      - name: Capture SpecOps and GhostLine screenshot regression
        if: ${{ always() && steps.build.outcome == 'success' }}
        working-directory: apps/webapp
        run: npm run ui:shoot:specops -- http://127.0.0.1:5173 artifacts/specops-screenshots
      - name: Upload UI screenshot regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cognitive-ui-screenshots
          path: |
            apps/webapp/artifacts/ui-screenshots/
            apps/webapp/artifacts/specops-screenshots/
          if-no-files-found: warn
          retention-days: 14
