name: auth-security-contract
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  auth-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install the locked workspace
        run: uv sync --locked --all-packages --all-groups
      - name: Compile control-plane modules
        run: .venv/bin/python -m compileall -q apps/control-plane apps/acquisition apps/interpretation apps/shared
      - name: Run authentication and research-case contracts
        run: >-\n          .venv/bin/python -m pytest\n          apps/control-plane/tests/test_auth_security.py\n          apps/control-plane/tests/test_research_case_invariants.py\n          apps/control-plane/tests/unit/test_migration_027_person_case_records.py\n          apps/control-plane/tests/unit/test_migration_028_processing_results.py\n          apps/control-plane/tests/test_research_case_projection.py\n          apps/acquisition/tests/unit/test_acquisition_worker.py\n          apps/acquisition/tests/unit/test_evidence_writer.py\n          apps/interpretation/tests/test_observation_consumer.py -q
