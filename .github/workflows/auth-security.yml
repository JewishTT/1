name: auth-security-contract
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  auth-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install the locked workspace
        run: uv sync --locked --all-packages --all-groups
      - name: Compile control-plane modules
        run: .venv/bin/python -m compileall -q apps/control-plane
      - name: Run authentication and research-case contracts
        run: .venv/bin/python -m pytest apps/control-plane/tests/test_auth_security.py apps/control-plane/tests/test_research_case_invariants.py apps/control-plane/tests/unit/test_migration_027_person_case_records.py -q
