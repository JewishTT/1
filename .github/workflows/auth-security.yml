name: auth-security-contract
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  auth-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install the locked workspace
        run: uv sync --locked --all-packages --all-groups
      - name: Compile control-plane, acquisition, interpretation, shared and zero-layer packages
        run: .venv/bin/python -m compileall -q apps/control-plane apps/acquisition apps/interpretation apps/shared apps/zero
      - name: Run authentication, migration, acquisition and interpretation contracts
        run: >-
          .venv/bin/python -m pytest
          apps/control-plane/tests/test_auth_security.py
          apps/control-plane/tests/test_research_case_invariants.py
          apps/control-plane/tests/unit/test_migration_027_person_case_records.py
          apps/control-plane/tests/unit/test_migration_028_processing_results.py
          apps/control-plane/tests/test_research_case_projection.py
          apps/control-plane/tests/test_research_case_reports.py
          apps/control-plane/tests/unit/test_migration_029_case_artifact_report_records.py
          apps/control-plane/tests/unit/test_dossier_store.py
          apps/acquisition/tests/unit/test_acquisition_worker.py
          apps/acquisition/tests/unit/test_source_catalogue_full.py
          apps/acquisition/tests/unit/test_source_executor_contracts.py
          apps/acquisition/tests/unit/test_case_execution_guard.py
          apps/acquisition/tests/unit/test_evidence_writer.py
          apps/interpretation/tests/test_transaction_lineage.py
          apps/interpretation/tests/test_onchain_source_parsers.py
          apps/interpretation/tests/test_observation_consumer.py
          -q
      - name: Run SpecOps&CI authorization, decision API and outbox contracts
        run: |
          .venv/bin/python -m pytest
          apps/control-plane/tests/unit/test_specops_ci_api.py
          apps/control-plane/tests/unit/test_specops_ci_authorization_gate.py
          apps/control-plane/tests/unit/test_specops_ci_signal_outbox.py
          -q
          .venv/bin/python -m ruff check
          apps/control-plane/api/routes/specops_ci.py
          apps/control-plane/services/specops_ci_authorization_gate.py
          apps/control-plane/db/specops_ci_signal_outbox.py
          apps/control-plane/tests/unit/test_specops_ci_api.py
          apps/control-plane/tests/unit/test_specops_ci_authorization_gate.py
          apps/control-plane/tests/unit/test_specops_ci_signal_outbox.py

      - name: Run zero-layer unit and canonical evidence integration contracts
        run: |
          .venv/bin/python -m pytest apps/zero/tests -q
          .venv/bin/python -m pytest apps/control-plane/tests/integration/test_layer0_direct_pipeline.py::test_zero_layer_stages_enter_the_canonical_raw_first_evidence_path -q
