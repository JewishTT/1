name: auth-security-contract
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  auth-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install the locked workspace
        run: uv sync --locked --all-packages --all-groups
      - name: Run authentication security contracts
        run: .venv/bin/python -m pytest apps/control-plane/tests/test_auth_security.py -q
