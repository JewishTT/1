name: Temporary PR maintenance

on:
  push:
    branches:
      - codex/dynamic-docs-asg-architecture-ui

permissions:
  contents: write

concurrency:
  group: temporary-pr-maintenance
  cancel-in-progress: true

jobs:
  fix-and-regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: astral-sh/setup-uv@v5
      - name: Sync locked workspace
        run: uv sync --locked --all-packages --all-groups

      - name: Apply the repository's Ruff import fixes to CI-blocking files
        run: |
          .venv/bin/python -m ruff check --fix \
            apps/control-plane/services/relation_projection_relay.py \
            apps/projection/graph/claim_projection.py \
            apps/projection/tests/unit/test_claim_projection.py
          .venv/bin/python -m ruff check \
            apps/control-plane/services/relation_projection_relay.py \
            apps/projection/graph/claim_projection.py \
            apps/projection/tests/unit/test_claim_projection.py

      - name: Regenerate all committed platform views in canonical import environment
        run: uv run python -c 'import conftest; from platform_model.build import main; raise SystemExit(main([]))'

      - name: Verify generator determinism and drift gate
        run: |
          uv run python -c 'import conftest; from platform_model.build import main; raise SystemExit(main(["--check"]))'
          uv run python -m pytest apps/shared/tests/contract/test_platform_model.py -q

      - name: Commit only the source files fixed and generated projections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/control-plane/services/relation_projection_relay.py apps/projection/graph/claim_projection.py apps/projection/tests/unit/test_claim_projection.py
          git add docs/platform/ README.md docs/README.md docs/CONTRIBUTING.md docs/architecture/ docs/adr/0028-context-definition-identity-and-placement.md
          if git diff --cached --quiet; then
            echo "No fixes or generated drift."
            exit 0
          fi
          git commit -m "ci: format projection contracts and regenerate platform views"
          git push origin "HEAD:${GITHUB_REF_NAME}"
