name: temporary-regen-034-platform-model
on:
  push:
    branches:
      - codex/034-person-research-case-closure
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/034-person-research-case-closure
          persist-credentials: true
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install the locked workspace
        run: uv sync --locked --all-packages --all-groups
      - name: Regenerate machine-derived docs from the exact branch
        run: .venv/bin/python -m platform_model.build
      - name: Commit generated artifacts back to the feature branch
        run: |
          git add README.md docs
          if git diff --cached --quiet; then
            echo "Generated artifacts already match."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git commit -m "chore(platform-model): regenerate artifacts for Feature 034"
          git push origin HEAD:codex/034-person-research-case-closure
