[tool.uv.workspace]
members = [
    "apps/shared",
    "apps/control-plane",
    "apps/acquisition",
    "apps/bulk-ingestion",
    "apps/interpretation",
    "apps/admission",
    "apps/projection",
    "apps/feedback",
    "apps/science",
    "apps/zero",
    "bench",
]

[project]
name = "cognitive"
version = "0.1.0"
description = "Global OSINT intelligence platform (workspace root)"
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
# FR-049 / WP-0 T006: `testpaths` bounds collection to platform code.
#
# `donors/` and `tmp/` hold vendored third-party checkouts (sherlock, bm25s,
# theharvester, user-scanner …). Before this line, a bare `pytest` at the repo root
# walked both: measured on this machine, 6769 tests collected and **831 collection
# errors** — every one of them a third-party module's own import failure, none of them
# ours. A baseline that reports 831 errors is a baseline nobody reads, and the real
# suite had to be selected by hand every time.
#
# `bench` is included deliberately. It is a workspace member with its own package
# (`bench/bench/`) and was excluded from every run until WP-0 T007 removed the stray
# empty `bench/__init__.py` that shadowed it.
testpaths = ["apps"]
# Directories never collected regardless of position, so an explicit
# `pytest tests/ somewhere/` cannot reintroduce the vendored trees.
norecursedirs = [
    "donors",
    "tmp",
    "logs",
    "*.egg-info",
    ".venv",
    "node_modules",
    "dist",
    "build",
    "k8s",
]
# `bench` is deliberately NOT in `testpaths`, and this is measured rather than
# preferred. `bench` is a workspace member whose importable package is
# `bench/bench/`, while the repo root also holds a plain `bench/` directory. Adding it
# to the root suite reproduces two failure modes depending on which other paths are on
# the command line: collected alone it works, but collected alongside `apps/…` it fails
# with `ImportError: cannot import name 'harness' from 'bench' (unknown location)` --
# pytest has already installed a namespace placeholder for `bench` in `sys.modules`, and
# a namespace package cannot be corrected after the fact.
#
# Both trees are legitimate; they simply cannot share one collection root. The bench
# suite therefore runs from its own workspace member, where its own
# `pyproject.toml` supplies `pythonpath = ["."]`. That run is reliable and is recorded
# as the second half of the baseline in specs/028/quickstart.md.
#
# `live` marks tests that make real network calls. They are deselected by default so the
# ordinary suite stays hermetic, and selected explicitly with `-m live` when the point is to
# prove the sources still answer. Skipped rather than passing quietly when the network is
# absent -- a live test that cannot reach its endpoint has proved nothing.
markers = ["contract", "integration", "live", "unit"]
# The Context Engine is async end to end: its store contract, the in-memory store, the
# Postgres store, the engine and CognitiveLoop all await. pytest-asyncio therefore has to
# run unmarked `async def` tests here.
#
# This line is load-bearing for repo-wide runs, and its absence was silent. pytest picks
# the config file from the *common ancestor* of the arguments, so `pytest apps/control-plane`
# read `apps/control-plane/pyproject.toml` (which sets auto) and passed, while
# `pytest apps/shared apps/control-plane` read this file, fell back to pytest-asyncio's
# strict default, and reported 71 context-engine tests as
# "async def functions are not natively supported". Green in one scope, red in the other.
asyncio_mode = "auto"
# FR-001/T001: six sibling test packages are named `contract` and two are named
# `integration`. Under pytest's default `prepend` import mode they collapse into a
# single top-level module, so whichever is collected first wins and the rest fail
# collection with "No module named 'contract.<test>'". That silently hid 98 passing
# tests, including the three transport-critical modules (test_idempotency,
# test_infra_connectivity, test_redpanda_emission) -- the ones that verify
# transport idempotency and emission. `importlib` import mode assigns unique module
# names without sys.path insertion and collects all 106.
addopts = "--import-mode=importlib"
