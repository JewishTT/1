# COGNITIVE donor and dependency licence registry
#
# Task T039 (specs/030-global-platform-upgrade/tasks.md). Reconciles the 11
# catalogues in docs/architecture/donors/ and the vendored checkouts under donors/
# with the distributions the workspace declares, into one machine-readable record.
#
# HOW TO READ THIS FILE
#   status: verified    - licence and version were read from a named file or from
#                        installed distribution metadata. license_source says which.
#   status: unverified  - the artefact is not present or declares nothing readable.
#                        license is null and verification_note says what was tried.
#                        A null here is a recorded gap, not a permissive default.
#   status: removed     - once declared, now gone from the graph.
#
# Nothing in this file is recalled. Every non-null license below was read out of the
# file named in its license_source. Where a licence is not SPDX-named (bespoke or
# custom terms) the value is null rather than forced into a family, because mapping
# a custom grant onto MIT/AGPL is a legal conclusion and not a clerical one.
#
# Enforced by apps/shared/tests/contract/test_donor_registry.py (T040, FR-113):
# a declared dependency or a vendored donor without an entry here fails the build.

schema_version: 1

registry:
  task: T039
  spec: specs/030-global-platform-upgrade
  requirement: FR-113
  vendored_checkout_count: 108
  vendored_checkouts_note: "The 108 checkouts under donors/ are separate git clones and are NOT tracked by this repository, so a bare CI checkout sees an empty donors/ tree. This count is the recorded inventory: the donor-side gate asserts against it when the checkouts are absent, and against the filesystem when they are present. The declared-dependency gate needs neither."
  catalogues_reconciled:
    - docs/architecture/donors/00-INDEX.md
    - docs/architecture/donors/01-COGNITIVE-WARFARE.md
    - docs/architecture/donors/02-SPEC-OPS-PENTEST.md
    - docs/architecture/donors/03-OSINT-CTI.md
    - docs/architecture/donors/04-GRAPH-TDA.md
    - docs/architecture/donors/05-SOCIAL-SIMULATION.md
    - docs/architecture/donors/06-UI-DASHBOARDS.md
    - docs/architecture/donors/07-INFRA-STACK.md
    - docs/architecture/donors/08-ECONOMICS.md
    - docs/architecture/donors/09-INTEGRATION-MATRIX.md
    - docs/architecture/donors/10-ZERO-LAYER.md
  scope_notes:
    - "'donors' covers [project].dependencies and [project.optional-dependencies] of every uv workspace member, plus every directory under donors/."
    - "[dependency-groups] (dev/test tooling) is deliberately out of scope: it is not shipped and is not a donor input. Stated here so the gap is visible, not implicit."
    - "Transitive dependencies are out of scope. Only what the workspace declares is recorded; a lockfile audit is a different instrument."
    - "A README licence badge is not treated as a licence grant. Several checkouts carry a badge for a LICENSE file that is not in the checkout; those are recorded unverified."
  version_convention:
    - vendored-checkout: git short SHA at the vendored checkout, plus commit_date.
    - installed-distribution: the version resolved in the workspace .venv.

