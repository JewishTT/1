[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zero"]

[project]
name = "cognitive-zero"
version = "0.1.0"
description = "Zero-layer contact harvesting pipeline: any input to contacts, NO AI (spec 010)"
requires-python = ">=3.11"
dependencies = ["cognitive-shared"]

[tool.uv.sources]
cognitive-shared = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["contract", "integration", "unit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]