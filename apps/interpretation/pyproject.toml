[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["parsers", "extractors", "dictionaries", "normalization", "aggregation", "ner", "search"]
py-modules = ["pipeline", "extract_demo"]

[project]
name = "cognitive-interpretation"
version = "0.1.0"
description = "Interpretation: parsers, mention normalization, NER, candidates"
requires-python = ">=3.11"
dependencies = [
    "cognitive-shared",
    "numpy>=1.26",
    # spec 007: deterministic extraction stack (T001)
    "trafilatura>=1.12",
    "selectolax>=0.3.21",
    "extruct>=0.17",
    "phonenumbers>=8.13",
    "nameparser>=1.1",
    "pymorphy3[ru]>=2.0",
    "pyahocorasick>=2.1",
    "charset-normalizer>=3.3",
    "pypdf>=4.3",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pillow>=10.4",
    "anyascii>=0.3.2",
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
lang-tiers = [
    "simplemma>=1.0",
    "jieba>=0.42",
    "fugashi>=1.3",
    "unidic-lite>=1.0",
]

[dependency-groups]
dev = [ "pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5" ]

[tool.uv.sources]
cognitive-shared = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = ["contract", "integration", "unit"]

[tool.ruff]
line-length = 100
target-version = "py311"