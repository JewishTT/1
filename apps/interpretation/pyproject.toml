[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["parsers", "extractors", "normalization", "aggregation", "ner"]
py-modules = ["pipeline"]

[project]
name = "cognitive-interpretation"
version = "0.1.0"
description = "Interpretation: parsers, mention normalization, NER, candidates"
requires-python = ">=3.11"
dependencies = [
    "cognitive-shared",
    "numpy>=1.26",
]

[dependency-groups]
dev = [ "pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5" ]

[tool.uv.sources]
cognitive-shared = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = ["contract", "integration", "unit"]

[tool.ruff]
line-length = 100
target-version = "py311"