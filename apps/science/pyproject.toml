[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claims", "hypotheses", "causal", "temporal", "structure", "robustness", "experiments", "review", "store", "errors", "scitda", "kinetics", "beliefs", "econ", "fixtures", "sims", "operators", "context"]

[tool.hatch.build.targets.wheel.force-include]
"_events.py" = "_events.py"
"anchoring.py" = "anchoring.py"

[project]
name = "cognitive-science"
version = "0.1.0"
description = "Scientific intelligence fabric: calibrated claims, hypotheses, causal/temporal/structural inference, robustness, experiments"
requires-python = ">=3.11"
dependencies = [
    "cognitive-shared",
    "numpy>=1.26",
]

[dependency-groups]
dev = [ "pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5", "hypothesis>=6.100" ]

[tool.uv.sources]
cognitive-shared = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = ["contract", "integration", "unit", "live: needs network egress or a running broker"]

[tool.ruff]
line-length = 100
target-version = "py311"