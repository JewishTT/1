name: cognitive-dev

# COGNITIVE dev topology (T005): single-node self-hosted stack.
# Dev profiles (T136): `core` (data plane: minio/postgres/kafka/redis/temporal),
# `streaming` (redpanda/flink/nessie), `collectors` (browsertrix), `analytics`
# (opensearch/clickhouse/neo4j). Run e.g.: docker compose --profile core --profile analytics up -d

services:
  minio:
    profiles: ["core"]
    image: quay.io/minio/minio:RELEASE.2024-08-17T01-24-54Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: demo
      MINIO_ROOT_PASSWORD: demopass
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    profiles: ["core"]
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 demo demopass &&
      mc mb -p local/knowledge &&
      mc mb -p local/knowledge-raw &&
      exit 0
      "

  kafka:
    profiles: ["core"]
    image: confluentinc/cp-kafka:7.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: cognitive-local
    ports: ["9092:9092"]
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 30

  schema-registry:
    profiles: ["core"]
    image: confluentinc/cp-schema-registry:7.7.0
    depends_on: [kafka]
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    ports: ["8081:8081"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 5s
      retries: 30

  postgres:
    profiles: ["core"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cognitive
      POSTGRES_USER: cognitive
      POSTGRES_PASSWORD: cognitive
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cognitive -d cognitive"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    profiles: ["core"]
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  opensearch:
    profiles: ["analytics"]
    image: opensearchproject/opensearch:2.14.0
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: CognitiveDefault1!
      bootstrap.memory_lock: "false"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ports: ["9200:9200", "9600:9600"]
    volumes: [opensearch-data:/usr/share/opensearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 10s
      retries: 30

  clickhouse:
    profiles: ["analytics"]
    image: clickhouse/clickhouse-server:24.8
    ports: ["8123:8123", "9009:9000"]
    volumes: [clickhouse-data:/var/lib/clickhouse]
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  neo4j:
    profiles: ["analytics"]
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/cognitive
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    ports: ["7474:7474", "7687:7687"]
    volumes: [neo4j-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p cognitive 'RETURN 1'"]
      interval: 10s
      timeout: 10s
      retries: 30

  temporal:
    profiles: ["core"]
    image: temporalio/auto-setup:1.25.2
    depends_on: [postgres]
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: cognitive
      POSTGRES_PWD: cognitive
      POSTGRES_SEEDS: postgres
    ports: ["7233:7233", "8088:8088"]
    healthcheck:
      test: ["CMD", "tctl", "workflow", "list", "-n", "default"]
      interval: 10s
      timeout: 5s
      retries: 30

  # --- Streaming / collector profiles (research R-06/R-10, plan phase C/D) ---

  redpanda:
    profiles: ["streaming"]
    image: redpandadata/redpanda:latest
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --reserve-memory 512M
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:19092
      - --advertise-kafka-addr PLAINTEXT://localhost:19092
      - --schema-registry-addr 0.0.0.0:18081
      - --rpc-addr 0.0.0.0:33145
      - --advertise-rpc-addr redpanda:33145
      - --set redpanda.enable_metrics_reporter=false
      - --set redpanda.enable_usage_metrics=false
    ports: ["19092:19092", "18081:18081", "19644:9644", "33145:33145"]
    volumes: [redpanda-data:/var/lib/redpanda/data]
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info"]
      interval: 10s
      timeout: 10s
      retries: 30

  redpanda-console:
    profiles: ["streaming"]
    image: docker.redpanda.com/redpandadata/console:latest
    depends_on: [redpanda]
    environment:
      KAFKA_BROKERS: redpanda:19092
      SCHEMAREGISTRY_URL: http://redpanda:18081
    ports: ["18080:8080"]

  flink-jobmanager:
    profiles: ["streaming"]
    image: flink:1.19.1
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 1600m
        taskmanager.numberOfTaskSlots: 4
    ports: ["18082:8081"]

  flink-taskmanager:
    profiles: ["streaming"]
    image: flink:1.19.1
    command: taskmanager
    depends_on: [flink-jobmanager]
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.memory.process.size: 1600m
        taskmanager.numberOfTaskSlots: 4

  nessie:
    profiles: ["streaming"]
    image: projectnessie/nessie:latest
    environment:
      QUARKUS_HTTP_PORT: 19120
      nessie.version.store.type: INMEMORY
    ports: ["19120:19120"]

  browsertrix:
    profiles: ["collectors"]
    image: webrecorder/browsertrix-crawler:latest
    # CLI/one-shot crawler: pulled here; runs are scheduled via the ThumbCrawl
    # adapter (T098) rather than a long-running daemon.

volumes:
  minio-data:
  kafka-data:
  postgres-data:
  opensearch-data:
  clickhouse-data:
  neo4j-data:
  redpanda-data: