[workspace]
resolver = "2"
members = [
    "worker-http",
    "worker-browser",
    "dispatcher",
    "frontier",
    "discovery",
    "content-router",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "signal"] }
reqwest = { version = "0.12", features = ["rustls-tls"] }
hyper = { version = "1", features = ["full"] }
sha2 = "0.10"
sha1 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
unused = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
lto = "thin"
codegen-units = 1