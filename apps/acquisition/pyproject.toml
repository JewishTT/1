[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adapters", "contracts", "discovery", "dispatcher", "frontier", "observation_gate", "policies", "runtime", "sources", "worker_browser", "worker_http"]
py-modules = ["artifact_sink", "case_execution_guard", "cc_extract", "cc_plan", "entity_search", "evidence_writer", "registry", "source_query_set", "stream", "worker_acquisition", "worker_service"]

[project]
name = "cognitive-acquisition"
version = "0.1.0"
description = "Acquisition subsystem: connector registry, bounded runner, SpiderFoot-style modules"
requires-python = ">=3.11,<3.14"
dependencies = [
    "certstream>=1.11",
    "cognitive-shared",
    "crawlee[playwright]>=1.10.0",
    "pyarrow>=25.0.1",
    "scrapy>=2.19.0",
    "warcio>=1.8.1",
]

[project.scripts]
cognitive-acquisition-worker = "worker_service:main"

[tool.uv.sources]
cognitive-shared = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["contract", "integration", "unit", "live: needs a running broker and network egress"]
