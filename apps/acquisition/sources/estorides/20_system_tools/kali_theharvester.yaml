name: kali_theharvester
enabled: true
category: 20. System Tools (Kali)
description: "theHarvester passive subdomain discovery through the authorized REST sidecar; no people, emails, breach data or active probes"
kind: runtime
requires_key: true
key_env: COGNITIVE_THEHARVESTER_API_KEY
contact: public_api
logs_queries: true
parser: structured_fields
applies_to:
  - domain
entity_hints:
  - domain
runtime_ref: theharvester
runtime_config:
  capability: subdomains
  result_role: DISCOVERY_ONLY
  max_results: 500
source_family: passive-domain-discovery
time_basis: FETCH
cost_class: moderate
