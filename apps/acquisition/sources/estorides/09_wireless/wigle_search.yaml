name: wigle_search
# Issue #45 is resolved: the schema now supports `basic_auth_env: [USER_VAR, PASS_VAR]`,
# which is the shape WiGLE actually requires (an API name plus an API token, sent as
# HTTP Basic). The previous single `key_env` could not express a credential pair, so
# this source used to be disabled to keep it from surfacing as "always fails".
# Enabled again now that the auth shape is expressible.
enabled: true
category: 09. Wireless
description: WiGLE — wireless network geolocation (SSID/BSSID lookup)
os: any
requires_key: true
parser: wigle
entity_hints:
- ssid
- bssid
- geolocation
- encryption
applies_to:
- keyword
tool:
  method: GET
  url: https://api.wigle.net/api/v2/network/search
  # WiGLE authenticates with HTTP Basic using an API *name* plus an API token.
  basic_auth_env:
  - WIGLE_API_NAME
  - WIGLE_API_TOKEN
  headers:
    User-Agent: Estorides/1.0
  params:
    ssid: '{query}'
    onlymine: 'false'
    first: 0
parse:
  family: json_object
  fields:
    bssid:
      path: bssid
      kind: bssid
      required: true
    ssid:
      path: ssid
      kind: unknown
    vendor:
      path: vname
      kind: vendor
