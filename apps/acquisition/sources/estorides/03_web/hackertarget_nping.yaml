name: hackertarget_nping
enabled: true
category: 03. Web Intelligence
description: HackerTarget TCP ping — reachability test
os: any
requires_key: false
contact: broker
logs_queries: true
parser: text_lines
entity_hints:
- ip
- port
- status
applies_to:
- ipv4
- domain
tool:
  method: GET
  url: https://api.hackertarget.com/nping/
  headers:
    User-Agent: Estorides/1.0
  params:
    q: '{query}'
parse:
  family: text_lines
  fields:
    ip:
      path: ""
      kind: ip
      pattern: ^(\d+\.\d+\.\d+\.\d+)
    hostname:
      path: ""
      kind: domain
      pattern: "([a-zA-Z0-9.-]+\\.[a-z]{2,})"
