name: otx_domain_passive
enabled: true
category: 05. Threat Intelligence
description: AlienVault OTX general indicator for a domain (public, no API key)
os: any
requires_key: false
parser: raw_text
entity_hints:
- domain
- ipv4
- url
applies_to:
- domain
tool:
  method: GET
  url: https://otx.alienvault.com/api/v1/indicators/domain/{query}/general
  headers:
    User-Agent: Estorides/1.0
parse:
  family: json_object
  fields:
    domain:
      path: indicator
      kind: domain
      required: true
    pulse_count:
      path: pulse_info.count
      kind: integer
    reputation:
      path: reputation
      kind: score
    tags:
      path: pulse_info.tags
      kind: tag
      many: true
    indicator_type:
      path: type
      kind: status
