name: otx_ip_passive
enabled: true
category: 05. Threat Intelligence
description: AlienVault OTX general indicator for an IPv4 (public, no API key)
os: any
requires_key: false
parser: raw_text
entity_hints:
- ipv4
- domain
- url
applies_to:
- ipv4
tool:
  method: GET
  url: https://otx.alienvault.com/api/v1/indicators/IPv4/{query}/general
  headers:
    User-Agent: Estorides/1.0
parse:
  family: json_object
  fields:
    ip:
      path: indicator
      kind: ip
      required: true
    asn:
      path: asn
      kind: asn
    pulse_count:
      path: pulse_info.count
      kind: integer
    reputation:
      path: reputation
      kind: score
    indicator_type:
      path: type
      kind: status
