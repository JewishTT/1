name: ipinfo_free
enabled: true
category: 02. IP & Infrastructure
description: IPInfo.io free tier — ASN, org, geo
os: any
requires_key: false
parser: ipinfo
entity_hints:
- ip
- geolocation
- asn
- org
applies_to:
- ipv4
- ipv6
- domain
tool:
  method: GET
  url: https://ipinfo.io/{query}/json
  headers:
    User-Agent: Estorides/1.0
  params: {}
parse:
  family: json_object
  fields:
    ip:
      path: ip
      kind: ip
      required: true
    hostname:
      path: hostname
      kind: domain
    org:
      path: org
      kind: isp
    city:
      path: city
      kind: place
    region:
      path: region
      kind: place
    country:
      path: country
      kind: country
    geolocation:
      path: loc
      kind: geolocation
