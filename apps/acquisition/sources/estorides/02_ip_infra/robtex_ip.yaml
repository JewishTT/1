name: robtex_ip
enabled: true
category: 02. IP & Infrastructure
description: Robtex free IP query (ASN, BGP route, active/passive DNS for an IP)
os: any
requires_key: false
parser: raw_text
entity_hints:
- ipv4
- asn
- domain
applies_to:
- ipv4
tool:
  method: GET
  url: https://freeapi.robtex.com/ipquery/{query}
  headers:
    User-Agent: Estorides/1.0
parse:
  family: json_object
  fields:
    ip:
      path: ip
      kind: ip
    prefix:
      path: prefix
      kind: prefix
    asn:
      path: asn
      kind: asn
