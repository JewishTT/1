name: ipwhois_free
enabled: true
category: 02. IP & Infrastructure
description: ipwhois.app free — ASN, geo, connection type, country flag
os: any
requires_key: false
parser: ipwhois
entity_hints:
- ip
- asn
- geolocation
- org
applies_to:
- ipv4
tool:
  method: GET
  url: https://ipwhois.app/json/{query}
  headers:
    User-Agent: Estorides/1.0
  params: {}
parse:
  family: json_object
  fields:
    ip:
      path: ip
      kind: ip
    country:
      path: country_code
      kind: country
    asn:
      path: asn
      kind: asn
    org:
      path: asn_org
      kind: organization
    isp:
      path: isp
      kind: isp
