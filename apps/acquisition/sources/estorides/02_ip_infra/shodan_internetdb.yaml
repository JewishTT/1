name: shodan_internetdb
enabled: true
category: 02. IP & Infrastructure
description: Shodan InternetDB free — exposed services, CPE, CVEs
os: any
requires_key: false
parser: shodan_internetdb
entity_hints:
- ip
- port
- service
- cve
- cpe
applies_to:
- ipv4
tool:
  method: GET
  url: https://internetdb.shodan.io/{query}
  headers:
    User-Agent: Estorides/1.0
  params: {}
parse:
  family: json_object
  fields:
    domain:
      path: "hostnames[*]"
      kind: domain
      many: true
    ip:
      path: ip_str
      kind: ip
    cpe:
      path: "cpes[*]"
      kind: technology
      many: true
    cve:
      path: "vulns[*].id"
      kind: cve
      many: true
    cve_score:
      path: "vulns[*].cvss.score"
      kind: score
      many: true
    port:
      path: "ports[*]"
      kind: port
      many: true
    tag:
      path: "tags[*]"
      kind: tag
      many: true
