name: ipwho_is
enabled: true
category: 02. IP & Infrastructure
description: ipwho.is geolocation and connection/ASN data (no key, no registration)
os: any
requires_key: false
parser: raw_text
entity_hints:
- ipv4
- asn
- country
- organization
applies_to:
- ipv4
- ipv6
tool:
  method: GET
  url: https://ipwho.is/{query}
  headers:
    User-Agent: Estorides/1.0
parse:
  family: json_object
  fields:
    ip:
      path: ip
      kind: ip
      required: true
    asn:
      path: connection.asn
      kind: asn
    org:
      path: connection.org
      kind: organization
    isp:
      path: connection.isp
      kind: isp
    country:
      path: country
      kind: country
    region:
      path: region
      kind: place
    city:
      path: city
      kind: place
    latitude:
      path: latitude
      kind: geolocation
    longitude:
      path: longitude
      kind: geolocation
