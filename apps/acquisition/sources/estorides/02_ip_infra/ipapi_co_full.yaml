name: ipapi_co_full
enabled: true
category: 02. IP & Infrastructure
description: ipapi.co (free HTTPS, includes currency, languages, ASN details)
os: any
requires_key: false
parser: ipapi_co
entity_hints:
- ip
- geolocation
- asn
- currency
- language
applies_to:
- ipv4
- ipv6
- domain
tool:
  method: GET
  url: https://ipapi.co/{query}/json/
  headers:
    User-Agent: Estorides/1.0
  params: {}
parse:
  family: json_object
  fields:
    ip:
      path: ip
      kind: ip
      required: true
    asn:
      path: asn
      kind: asn
    org:
      path: org
      kind: organization
    isp:
      path: isp
      kind: isp
    country:
      path: country_code
      kind: country
    city:
      path: city
      kind: place
    latitude:
      path: latitude
      kind: geolocation
    longitude:
      path: longitude
      kind: geolocation
    country_code:
      path: country_code
      kind: country
