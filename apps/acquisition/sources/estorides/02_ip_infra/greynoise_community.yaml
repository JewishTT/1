name: greynoise_community
enabled: true
category: 02. IP & Infrastructure
description: GreyNoise Community API — internet noise vs targeted scanning
os: any
requires_key: false
parser: greynoise
entity_hints:
- ip
- classification
- actor
- tag
applies_to:
- ipv4
tool:
  method: GET
  url: https://api.greynoise.io/v3/community/{query}
  headers:
    User-Agent: Estorides/1.0
  params: {}
parse:
  family: json_object
  fields:
    ip:
      path: ip
      kind: ip
      required: true
    name:
      path: name
      kind: organization
    classification:
      path: classification
      kind: reputation
    link:
      path: link
      kind: url
    last_seen:
      path: last_seen
      kind: timestamp
