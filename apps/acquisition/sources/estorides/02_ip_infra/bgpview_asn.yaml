name: bgpview_asn
enabled: true
category: 02. IP & Infrastructure
description: BGPView ASN — AS info, prefixes, peers (keyless)
os: any
requires_key: false
parser: bgpview
entity_hints:
- asn
- prefix
applies_to:
- asn
tool:
  method: GET
  url: https://api.bgpview.io/asn/{query}
  headers:
    User-Agent: Estorides/1.0
  params: {}
parse:
  family: json_object
  fields:
    asn:
      path: data.asn
      kind: asn
      required: true
    name:
      path: data.name
      kind: organization
    description:
      path: data.description_short
      kind: description
    country:
      path: data.country_code
      kind: country
    prefix:
      path: "data.prefixes[*].prefix"
      kind: prefix
      many: true
