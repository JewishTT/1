name: microlink
enabled: true
category: 12. Visual
description: Microlink — page metadata + screenshot (no key, free tier)
os: any
contact: active
requires_key: false
parser: microlink
entity_hints:
- url
- title
- description
- image
- logo
- lang
applies_to:
- url
- domain
tool:
  method: GET
  url: https://api.microlink.io
  headers:
    User-Agent: Estorides/1.0
  params:
    url: '{query}'
    screenshot: 'true'
    meta: 'true'
parse:
  family: json_object
  fields:
    title:
      path: data.title
      kind: description
    description:
      path: data.description
      kind: description
    author:
      path: data.author
      kind: person
    publisher:
      path: data.publisher
      kind: organization
    url:
      path: data.url
      kind: url
    image:
      path: data.image.url
      kind: url
    lang:
      path: data.lang
      kind: language
