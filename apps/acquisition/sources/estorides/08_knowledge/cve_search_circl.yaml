name: cve_search_circl
enabled: true
category: 08. Knowledge
description: cve.circl.lu — community CVE mirror
os: any
requires_key: false
parser: cve_circl
entity_hints:
- cve
- cvss
- summary
- references
applies_to:
- cve
- keyword
tool:
  method: GET
  url: https://cve.circl.lu/api/search/{query}
  headers:
    User-Agent: Estorides/1.0
  params: {}
parse:
  family: json_rows
  fields:
    cve:
      path: id
      kind: cve
      required: true
    summary:
      path: summary
      kind: description
    published:
      path: published
      kind: timestamp
    modified:
      path: modified
      kind: timestamp
    score:
      path: cvss.score
      kind: score
