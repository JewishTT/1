name: crossref_doi
enabled: true
category: 08. Knowledge
description: Crossref — DOI / publication metadata
os: any
requires_key: false
parser: crossref
entity_hints:
- doi
- work
- author
- citation
applies_to:
- keyword
tool:
  method: GET
  url: https://api.crossref.org/works
  headers:
    User-Agent: Estorides/1.0 (mailto:research@estorides.local)
  params:
    query: '{query}'
    rows: 10
parse:
  family: json_rows
  list_path: message.items
  fields:
    doi:
      path: DOI
      kind: identifier
      required: true
    title:
      path: "title[*]"
      kind: article
      many: true
    author:
      path: "author[*].family"
      kind: person
      many: true
    publisher:
      path: publisher
      kind: organization
    published:
      path: "issued.date-parts[*][*]"
      kind: timestamp
      many: true
    url:
      path: URL
      kind: url
