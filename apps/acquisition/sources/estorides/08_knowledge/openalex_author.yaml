name: openalex_author
enabled: true
category: 08. Knowledge
description: OpenAlex — author search (academic identities)
os: any
requires_key: false
parser: openalex
entity_hints:
- author
- institution
- work_count
- orcid
applies_to:
- keyword
tool:
  method: GET
  url: https://api.openalex.org/authors
  headers:
    User-Agent: Estorides/1.0 (mailto:research@estorides.local)
  params:
    search: '{query}'
    per_page: 10
parse:
  family: json_object
  fields:
    author:
      path: id
      kind: identifier
      required: true
    name:
      path: display_name
      kind: person
    orcid:
      path: orcid
      kind: identifier
    country:
      path: "last_known_institutions[*].country_code"
      kind: country
      many: true
    works_count:
      path: works_count
      kind: integer
