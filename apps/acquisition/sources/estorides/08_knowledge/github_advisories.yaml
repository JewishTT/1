name: github_advisories
enabled: true
category: 08. Knowledge
description: GitHub Security Advisories — CVE database
os: any
requires_key: false
parser: github_advisories
entity_hints:
- cve
- ghsa
- vulnerability
- severity
- package
applies_to:
- keyword
- cve
- ghsa
tool:
  method: GET
  url: https://api.github.com/advisories
  headers:
    Accept: application/vnd.github+json
    User-Agent: Estorides/1.0
  params:
    query: '{query}'
    per_page: 30
parse:
  family: json_rows
  fields:
    ghsa:
      path: ghsa_id
      kind: identifier
      required: true
    cve:
      path: cve_id
      kind: cve
    summary:
      path: summary
      kind: description
    severity:
      path: severity
      kind: status
    package:
      path: "vulnerabilities[*].package.name"
      kind: technology
      many: true
    ecosystem:
      path: "vulnerabilities[*].package.ecosystem"
      kind: unknown
      many: true
    url:
      path: html_url
      kind: url
    published:
      path: published_at
      kind: timestamp
