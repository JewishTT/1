name: openalex_work
enabled: true
category: 08. Knowledge
description: OpenAlex — academic works / authors / institutions
os: any
requires_key: false
parser: openalex
entity_hints:
- work
- author
- institution
- doi
- concept
applies_to:
- keyword
tool:
  method: GET
  url: https://api.openalex.org/works
  headers:
    User-Agent: Estorides/1.0 (mailto:research@estorides.local)
  params:
    search: '{query}'
    per_page: 15
parse:
  family: json_rows
  list_path: results
  fields:
    work:
      path: id
      kind: article
      required: true
    title:
      path: title
      kind: article
    doi:
      path: doi
      kind: identifier
    publisher:
      path: primary_location.source.display_name
      kind: organization
    author:
      path: "authorships[*].author.display_name"
      kind: person
      many: true
    published:
      path: publication_date
      kind: timestamp
    cited_by:
      path: cited_by_count
      kind: integer
    language:
      path: language
      kind: language
