name: nvd_cve
enabled: true
category: 08. Knowledge
description: NVD — National Vulnerability Database CVE feed
os: any
requires_key: false
parser: nvd_cve
entity_hints:
- cve
- cvss
- cpe
- vendor
- product
- vector
applies_to:
- cve
- keyword
tool:
  method: GET
  url: https://services.nvd.nist.gov/rest/json/cves/2.0
  headers:
    User-Agent: Estorides/1.0
  params:
    keywordSearch: '{query}'
    resultsPerPage: 20
parse:
  family: json_rows
  list_path: vulnerabilities
  fields:
    cve:
      path: cve.id
      kind: cve
      required: true
    description:
      path: "cve.descriptions[*].value"
      kind: description
      many: true
    published:
      path: cve.published
      kind: timestamp
    modified:
      path: cve.lastModified
      kind: timestamp
    score:
      path: "cve.metrics.cvssMetricV31[*].cvssData.baseScore"
      kind: score
      many: true
    vector:
      path: "cve.metrics.cvssMetricV31[*].cvssData.vectorString"
      kind: unknown
      many: true
    reference:
      path: "cve.references[*].url"
      kind: url
      many: true
