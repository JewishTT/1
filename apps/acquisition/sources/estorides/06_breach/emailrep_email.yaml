name: emailrep_email
enabled: true
category: 06. Breach Intelligence
description: EmailRep — email reputation, breach data, domain reputation, and risk scoring (passive, free tier)
os: any
requires_key: false
parser: raw_text
entity_hints:
- email
- reputation
- breach
- domain
applies_to:
- email
tool:
  method: GET
  url: https://emailrep.io/{query}
  headers:
    User-Agent: Estorides/1.0
    Accept: application/json
parse:
  family: json_object
  fields:
    email:
      path: email
      kind: email
      required: true
    reputation:
      path: reputation
      kind: score
    details:
      path: details
      kind: leak
      many: true
    name:
      path: details.full_name
      kind: person
    twitter:
      path: details.twitter
      kind: handle
    linkedin:
      path: details.linkedin
      kind: url
