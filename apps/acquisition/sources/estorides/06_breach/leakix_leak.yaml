name: leakix_leak
enabled: true
category: 06. Breach Intelligence
description: LeakIX — search indexed leaks by domain, email, or keyword (passive, no key)
os: any
requires_key: false
contact: none
parser: raw_text
entity_hints:
- email
- domain
- leak
- ip
- url
applies_to:
- email
- domain
- keyword
tool:
  method: GET
  url: https://leakix.net/api/search
  headers:
    User-Agent: Estorides/1.0
    Accept: application/json
  params:
    q: '{query}'
parse:
  family: json_rows
  fields:
    leak:
      path: id
      kind: leak
      required: true
    domain:
      path: domain
      kind: domain
    username:
      path: username
      kind: handle
    email:
      path: email
      kind: email
    port:
      path: port
      kind: port
    service:
      path: service
      kind: technology
    found:
      path: time
      kind: timestamp
