name: medium_public
enabled: true
category: 04. Social Media
description: Medium/@user public profile
os: any
requires_key: false
parser: opengraph
entity_hints:
- person
- article
applies_to:
- username
tool:
  method: GET
  url: https://medium.com/@{query}
  headers:
    User-Agent: Estorides/1.0
  params: {}
parse:
  family: json_rows
  fields:
    post:
      path: title
      kind: article
    author:
      path: author.name
      kind: person
    description:
      path: dek
      kind: description
    url:
      path: url
      kind: url
    published:
      path: firstPublishedDate
      kind: timestamp
