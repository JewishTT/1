name: keybase_lookup
enabled: true
category: 04. Social Media
description: Keybase — verified identities, devices, social proofs
os: any
requires_key: false
parser: keybase
entity_hints:
- person
- public_key
- social_proof
- device
applies_to:
- username
tool:
  method: GET
  url: https://keybase.io/_/api/1.0/user/lookup.json
  headers:
    User-Agent: Estorides/1.0
  params:
    usernames: '{query}'
parse:
  family: json_object
  fields:
    username:
      path: them.username
      kind: handle
      required: true
    full_name:
      path: them.full_name
      kind: person
    location:
      path: them.location
      kind: place
    identity:
      path: "them.them.identities[*].network_name"
      kind: handle
      many: true
    proofs_summary:
      path: them.proofs_summary.all_time
      kind: integer
