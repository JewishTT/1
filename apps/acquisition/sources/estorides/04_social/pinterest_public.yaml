name: pinterest_public
enabled: true
category: 04. Social Media
description: Pinterest public profile (HTML scrape of meta tags)
os: any
requires_key: false
parser: opengraph
entity_hints:
- person
- board
- image
applies_to:
- username
tool:
  method: GET
  url: https://www.pinterest.com/{query}/
  headers:
    User-Agent: Mozilla/5.0 (compatible; Estorides/1.0)
  params: {}
parse:
  family: json_object
  fields:
    username:
      path: username
      kind: handle
      required: true
    description:
      path: biography
      kind: description
    image:
      path: image_large_url
      kind: url
    website:
      path: website_url
      kind: url
