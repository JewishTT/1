name: telegram_tginfo
enabled: true
category: 04. Social Media
description: tg-info.com — Telegram channel/user public metadata
os: any
requires_key: false
parser: raw_text
entity_hints:
- person
- channel
- telegram_handle
applies_to:
- username
tool:
  method: GET
  url: https://t.me/{query}
  headers:
    User-Agent: Estorides/1.0
  params: {}
parse:
  family: json_object
  fields:
    username:
      path: username
      kind: handle
      required: true
    name:
      path: name
      kind: person
    description:
      path: bio
      kind: description
    subscribers:
      path: subscribers_count
      kind: integer
