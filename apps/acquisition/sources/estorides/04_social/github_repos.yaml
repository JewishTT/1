name: github_repos
enabled: true
category: 04. Social Media
description: GitHub repository search (org or topic)
os: any
requires_key: false
parser: github_search
entity_hints:
- repository
- organization
- language
applies_to:
- keyword
tool:
  method: GET
  url: https://api.github.com/search/repositories
  headers:
    Accept: application/vnd.github.v3+json
    User-Agent: Estorides/1.0
  params:
    q: user:{query}
    per_page: 30
    sort: updated
parse:
  family: json_rows
  fields:
    repository:
      path: full_name
      kind: repository
      required: true
    description:
      path: description
      kind: description
    language:
      path: language
      kind: language
    owner:
      path: owner.login
      kind: handle
    url:
      path: html_url
      kind: url
    stars:
      path: stargazers_count
      kind: integer
    created_at:
      path: created_at
      kind: timestamp
    topics:
      path: "topics[*]"
      kind: tag
      many: true
