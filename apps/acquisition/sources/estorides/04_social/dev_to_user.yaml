name: dev_to_user
enabled: true
category: 04. Social Media
description: DEV.to public user/article API
os: any
requires_key: false
parser: dev_to
entity_hints:
- person
- article
- tag
applies_to:
- username
tool:
  method: GET
  url: https://dev.to/api/users/by_username
  headers:
    User-Agent: Estorides/1.0
  params:
    url: '{query}'
parse:
  family: json_object
  fields:
    username:
      path: username
      kind: handle
      required: true
    name:
      path: name
      kind: person
    location:
      path: location
      kind: place
    website:
      path: website_url
      kind: url
    joined:
      path: joined_at
      kind: timestamp
