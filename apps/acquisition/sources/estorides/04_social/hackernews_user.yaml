name: hackernews_user
enabled: true
category: 04. Social Media
description: HackerNews user profile
os: any
requires_key: false
parser: hackernews
entity_hints:
- person
- karma
- submission
applies_to:
- username
tool:
  method: GET
  url: https://hacker-news.firebaseio.com/v0/user/{query}.json
  headers:
    User-Agent: Estorides/1.0
  params: {}
parse:
  family: json_object
  fields:
    username:
      path: id
      kind: handle
      required: true
    karma:
      path: karma
      kind: integer
    created:
      path: created
      kind: timestamp
    submitted_count:
      path: submitted
      kind: integer
