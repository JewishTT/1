name: blockchain_btc_balance
enabled: true
category: 10. Blockchain
description: Blockchain.com — BTC address balance and tx count
os: any
requires_key: false
parser: blockchain_btc
entity_hints:
- btc_address
- balance
- total_received
- tx_count
applies_to:
- btc_address
tool:
  method: GET
  url: https://blockchain.info/rawaddr/{query}
  headers:
    User-Agent: Estorides/1.0
  params:
    limit: 50
    cors: 'true'
parse:
  family: json_object
  fields:
    address:
      path: address
      kind: crypto
      required: true
    hash160:
      path: hash160
      kind: identifier
    received:
      path: total_received
      kind: amount
    sent:
      path: total_sent
      kind: amount
    balance:
      path: final_balance
      kind: amount
    tx_count:
      path: n_tx
      kind: integer
