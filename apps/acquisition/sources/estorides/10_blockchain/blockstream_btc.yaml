name: blockstream_btc
enabled: true
category: 10. Blockchain
description: Blockstream.info — BTC address stats
os: any
requires_key: false
parser: blockstream
entity_hints:
- btc_address
- chain_stats
- mempool_stats
applies_to:
- btc_address
tool:
  method: GET
  url: https://blockstream.info/api/address/{query}
  headers:
    User-Agent: Estorides/1.0
  params: {}
parse:
  family: json_object
  fields:
    address:
      path: address
      kind: crypto
      required: true
    funded:
      path: chain_stats.funded_txo_sum
      kind: amount
    received:
      path: chain_stats.received_txo_sum
      kind: amount
    tx_count:
      path: chain_stats.tx_count
      kind: integer
