name: mempool_space_block
enabled: true
category: 10. Blockchain
description: mempool.space — latest BTC block tip
os: any
requires_key: false
parser: raw_text
entity_hints:
- btc_block
- height
- timestamp
applies_to:
- any
tool:
  method: GET
  url: https://mempool.space/api/blocks/tip/height
  headers:
    User-Agent: Estorides/1.0
  params: {}
parse:
  family: json_object
  fields:
    height:
      path: height
      kind: integer
      required: true
    hash:
      path: hash
      kind: hash
    timestamp:
      path: timestamp
      kind: timestamp
    tx_count:
      path: n_tx
      kind: integer
    size:
      path: size
      kind: integer
    weight:
      path: weight
      kind: integer
