name: blockchain_btc_tx
enabled: true
category: 10. Blockchain
description: Blockchain.com — single transaction lookup
os: any
requires_key: false
parser: blockchain_tx
entity_hints:
- btc_tx
- input
- output
- value
applies_to:
- btc_address
tool:
  method: GET
  url: https://blockchain.info/rawtx/{query}
  headers:
    User-Agent: Estorides/1.0
  params:
    cors: 'true'
parse:
  family: json_rows
  list_path: txs
  fields:
    hash:
      path: hash
      kind: hash
      required: true
    time:
      path: time
      kind: timestamp
    total_out:
      path: total_out
      kind: amount
    size:
      path: size
      kind: integer
    block:
      path: block_height
      kind: integer
