name: dns_google
enabled: true
category: 01. DNS Intelligence
description: Google DNS-over-HTTPS, ANY record lookup
os: any
requires_key: false
parser: dns_json
entity_hints:
- domain
- ip
- txt_record
applies_to:
- domain
tool:
  method: GET
  url: https://dns.google/resolve
  headers:
    Accept: application/dns-json
    User-Agent: Estorides/1.0
  params:
    name: '{query}'
    type: ANY
parse:
  family: dns_json
  fields:
    status:
      path: Status
      kind: integer
    answer:
      path: "Answer[*].data"
      kind: unknown
      many: true
    authority:
      path: "Authority[*].data"
      kind: unknown
      many: true
