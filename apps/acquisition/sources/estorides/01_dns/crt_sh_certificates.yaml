name: crt_sh_certificates
enabled: true
category: 01. DNS Intelligence
description: Certificate Transparency log search (subdomain discovery gold mine)
os: any
requires_key: false
parser: crtsh_json
entity_hints:
- domain
- certificate
- organization
applies_to:
- domain
tool:
  method: GET
  url: https://crt.sh/
  headers:
    User-Agent: Estorides/1.0
  params:
    q: '%.{query}'
    output: json
parse:
  family: json_rows
  fields:
    issuer:
      path: issuer_name
      kind: organization
    issuer_ca:
      path: issuer_ca_id
      kind: identifier
    common_name:
      path: common_name
      kind: domain
    name_value:
      path: name_value
      kind: subdomain
      many: true
    not_before:
      path: not_before
      kind: timestamp
    not_after:
      path: not_after
      kind: timestamp
