[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "application", "domain", "services", "db", "workflows", "badges", "modifier"]

[project]
name = "cognitive-control-plane"
version = "0.1.0"
description = "FastAPI control plane: investigations, sources, policy, budgets, governance"
requires-python = ">=3.11"
dependencies = [
    "cognitive-shared",
    "cognitive-science",
    "cognitive-interpretation",
    "cognitive-bulk-ingestion",
    "cognitive-zero",
    "cognitive-acquisition",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "alembic>=1.13",
    "temporalio>=1.4",
    "clickhouse-connect>=0.7",
    "neo4j>=5.21",
    "orjson>=3.10",
]

[dependency-groups]
dev = [ "pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5" ]

[tool.uv.sources]
cognitive-shared = { workspace = true }
cognitive-science = { workspace = true }
cognitive-interpretation = { workspace = true }
cognitive-bulk-ingestion = { workspace = true }
cognitive-zero = { workspace = true }
cognitive-acquisition = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = ["contract", "integration", "unit"]

[tool.ruff]
line-length = 100
target-version = "py311"