[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["resolution", "engine", "evidence"]

[project]
name = "cognitive-admission"
version = "0.1.0"
description = "Admission engine, entity resolution, calibration, source independence"
requires-python = ">=3.11"
dependencies = [
    "cognitive-shared",
    "numpy>=1.26",
    "scipy>=1.13",
]

[dependency-groups]
dev = [ "pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5" ]

[tool.uv.sources]
cognitive-shared = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = ["contract", "integration", "unit"]

[tool.ruff]
line-length = 100
target-version = "py311"