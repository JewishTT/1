[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["resolution", "engine", "independence"]

[project]
name = "cognitive-admission"
version = "0.1.0"
description = "Admission engine, entity resolution, calibration, source independence"
requires-python = ">=3.11"
dependencies = [
    "cognitive-shared",
    # Splink needs a NumPy 1.26 floor and a scikit-learn; both are real runtime deps of
    # splink_adapter, not optional extras. Pinned so a fresh resolve reproduces the
    # environment the 20 adapter tests were actually run against.
    "numpy>=1.26,<3",
    "scikit-learn>=1.3",
    "scipy>=1.13",
    "splink==5.0.0",
]

[dependency-groups]
dev = [ "pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5" ]

[tool.uv.sources]
cognitive-shared = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = ["contract", "integration", "unit", "live: needs network egress or a running broker"]

[tool.ruff]
line-length = 100
target-version = "py311"