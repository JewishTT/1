[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config", "events", "storage", "domain", "observability", "workflow", "scoring", "contracts", "security", "donor", "network", "ids", "datasets"]

[project]
name = "cognitive-shared"
version = "0.1.0"
description = "Shared contracts, events, storage, scoring, observability for COGNITIVE"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "confluent-kafka>=2.4",
    "redis>=5.0",
    "aioboto3>=13",
    "httpx>=0.27",
    "protobuf>=5.26",
    "grpcio>=1.64",
    "grpcio-tools>=1.64",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp>=1.25",
    "prometheus-client>=0.20",
    # spec 007: dictionary dataset infra (T001)
    "pyahocorasick>=2.1",
    "charset-normalizer>=3.3",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "testcontainers[kafka,postgres]>=4.4",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = ["contract", "integration", "unit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]