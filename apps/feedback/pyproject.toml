[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["feedback"]

[project]
name = "cognitive-feedback"
version = "0.1.0"
description = "Feedback engine, utility scoring, stopping policy"
requires-python = ">=3.11"
dependencies = [
    "cognitive-shared",
    "cognitive-control-plane",
    "numpy>=1.26",
]

[dependency-groups]
dev = [ "pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5" ]

[tool.uv.sources]
cognitive-shared = { workspace = true }
cognitive-control-plane = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = ["contract", "integration", "unit"]

[tool.ruff]
line-length = 100
target-version = "py311"