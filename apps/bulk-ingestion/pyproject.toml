[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["historical"]
py-modules = ["backfill"]

[project]
name = "cognitive-bulk-ingestion"
version = "0.1.0"
description = "Bulk ingestion: historical archive replay, reservoir sampling, bulk collectors"
requires-python = ">=3.11"
dependencies = [
    "cognitive-shared",
    "httpx>=0.27",
]

[dependency-groups]
dev = [ "pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5" ]

[tool.uv.sources]
cognitive-shared = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = ["contract", "integration", "unit"]

[tool.ruff]
line-length = 100
target-version = "py311"